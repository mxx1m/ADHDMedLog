<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0a0c11">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Wirkungslog">
<title>Wirkungslog</title>
<style>
:root{
  color-scheme: dark;
  --bg:#0a0c11;
  --surface:#141821;
  --surface-2:#1d222d;
  --inset:#171b24;
  --hairline:rgba(255,255,255,.075);
  --text:#f1f4fa;
  --text-2:rgba(226,232,244,.60);
  --text-3:rgba(226,232,244,.33);
  --accent:#f2b03d;
  --accent-2:#ffc86e;
  --accent-soft:rgba(242,176,61,.13);
  --warn:#f2607a;
  --warn-soft:rgba(242,96,122,.14);
  --r0:#2b3241;
  --r1:#7a6446;
  --r2:#c08f3c;
  --r3:#f2b03d;
  /* Blöcke folgen dem Tageslauf: Vormittag warm, Nachmittag kupfern, Abend kühl */
  --b1:#f2b03d; --b1-bg:rgba(242,176,61,.09); --b1-br:rgba(242,176,61,.28);
  --b2:#e2854e; --b2-bg:rgba(226,133,78,.09); --b2-br:rgba(226,133,78,.28);
  --b3:#8b93ef; --b3-bg:rgba(139,147,239,.09); --b3-br:rgba(139,147,239,.28);
  --s-arbeit:#5b9bf5;   --s-arbeit-bg:rgba(91,155,245,.15);
  --s-reise:#a98bf0;    --s-reise-bg:rgba(169,139,240,.15);
  --s-frei:#4cc9a0;     --s-frei-bg:rgba(76,201,160,.15);
  --radius:20px; --radius-s:13px; --tap:44px; --sp:16px;
  --ease:cubic-bezier(.32,.72,0,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg)}
body{
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;
  font-size:17px;line-height:1.42;-webkit-font-smoothing:antialiased;
  padding-bottom:calc(112px + env(safe-area-inset-bottom));
  background:radial-gradient(115% 62% at 50% -6%, rgba(242,176,61,.10) 0%, rgba(242,176,61,0) 60%), var(--bg);
  background-attachment:fixed;min-height:100vh;
}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
@media (prefers-reduced-motion: reduce){*{transition:none !important}}

.toast{
  position:fixed;top:calc(env(safe-area-inset-top) + 12px);left:50%;z-index:70;
  padding:8px 15px;border-radius:18px;max-width:calc(100% - 32px);
  background:rgba(30,35,46,.74);
  -webkit-backdrop-filter:saturate(200%) blur(22px);backdrop-filter:saturate(200%) blur(22px);
  border:1px solid rgba(255,255,255,.11);
  box-shadow:0 10px 28px rgba(0,0,0,.5);
  font-size:13px;font-weight:560;color:var(--text);text-align:center;
  opacity:0;pointer-events:none;transform:translateX(-50%) translateY(-10px);
  transition:opacity .28s var(--ease),transform .28s var(--ease)
}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
main{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) var(--sp) 22px}

/* Datumsleiste */
.datebar{display:flex;align-items:center;gap:9px;margin-bottom:12px}
.datebar button.arrow{
  width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none;
  color:var(--accent-2);font-size:20px;background:var(--surface);border:1px solid var(--hairline)
}
.datebar button.arrow[disabled]{opacity:.3;color:var(--text-3)}
.datepill{
  flex:1;height:40px;border-radius:20px;background:var(--surface);border:1px solid var(--hairline);
  display:flex;align-items:center;justify-content:center;gap:7px;
  font-size:15px;font-weight:600;position:relative;color:var(--text)
}
.datepill svg{width:15px;height:15px;fill:none;stroke:var(--accent-2);stroke-width:1.8;stroke-linecap:round}
.datepill input{position:absolute;inset:0;opacity:0;width:100%;height:100%;border:0;background:none;cursor:pointer}

/* Statuswahl */
.status{display:flex;gap:8px;margin-bottom:14px}
.status button{
  position:relative;isolation:isolate;overflow:hidden;
  flex:1;min-height:60px;border-radius:var(--radius-s);text-align:center;
  background:var(--surface);border:1px solid var(--hairline);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  font-size:11.5px;font-weight:540;color:var(--text-2);line-height:1.2;padding:0 6px;
  transition:background .18s var(--ease),border-color .18s,color .18s
}
.status button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.status button .glow,.status button .flash{
  position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;color:inherit
}
.status button .glow{
  background:radial-gradient(118% 92% at 50% 112%, currentColor 0%, transparent 66%);
  opacity:0;transform:scale(.82);
  transition:opacity .52s var(--ease), transform .52s var(--ease)
}
.status button[aria-pressed=true] .glow{opacity:.34;transform:scale(1)}
.status button .flash{background:radial-gradient(58% 58% at 50% 52%, currentColor 0%, transparent 72%);opacity:0}
@keyframes lightUp{0%{opacity:0;transform:scale(.55)}32%{opacity:.6}100%{opacity:0;transform:scale(1.55)}}
.status button.lit .flash{animation:lightUp .66s var(--ease)}
.status button[data-s=arbeit][aria-pressed=true]{background:var(--s-arbeit-bg);border-color:var(--s-arbeit);color:var(--s-arbeit);font-weight:640}
.status button[data-s=reise][aria-pressed=true]{background:var(--s-reise-bg);border-color:var(--s-reise);color:var(--s-reise);font-weight:640}
.status button[data-s=frei][aria-pressed=true]{background:var(--s-frei-bg);border-color:var(--s-frei);color:var(--s-frei);font-weight:640}

/* Karten */
.card{background:var(--surface);border:1px solid var(--hairline);border-radius:var(--radius);padding:14px;margin-bottom:11px}
.card[data-b="0"]{border-color:var(--b1-br);background:linear-gradient(180deg,var(--b1-bg) 0,rgba(0,0,0,0) 96px),var(--surface)}
.card[data-b="1"]{border-color:var(--b2-br);background:linear-gradient(180deg,var(--b2-bg) 0,rgba(0,0,0,0) 96px),var(--surface)}
.card[data-b="2"]{border-color:var(--b3-br);background:linear-gradient(180deg,var(--b3-bg) 0,rgba(0,0,0,0) 96px),var(--surface)}
.card[data-b="0"] .num{background:var(--b1-bg);color:var(--b1)}
.card[data-b="1"] .num{background:var(--b2-bg);color:var(--b2)}
.card[data-b="2"] .num{background:var(--b3-bg);color:var(--b3)}
.card[data-b="0"] .cardhead[aria-expanded=true] .chev{color:var(--b1)}
.card[data-b="1"] .cardhead[aria-expanded=true] .chev{color:var(--b2)}
.card[data-b="2"] .cardhead[aria-expanded=true] .chev{color:var(--b3)}
.wingroup[data-w="0"] .wingroup-head{background:var(--b1-bg)}
.wingroup[data-w="0"] .wingroup-head .nm{color:var(--b1)}
.wingroup[data-w="1"] .wingroup-head{background:var(--b2-bg)}
.wingroup[data-w="1"] .wingroup-head .nm{color:var(--b2)}
.card h2{
  margin:0;font-size:17px;font-weight:660;letter-spacing:-.012em;
  display:flex;align-items:center;justify-content:center;gap:9px
}
.card h2 .num{
  width:23px;height:23px;border-radius:8px;background:var(--accent-soft);color:var(--accent-2);
  font-size:12px;font-weight:720;display:grid;place-items:center;flex:none
}
.cardhead{position:relative;display:block;width:100%;text-align:center;padding:2px 30px}
.cardhead .chev{position:absolute;right:2px;top:50%;transform:translateY(-50%);color:var(--text-3);font-size:13px;transition:transform .28s var(--ease)}
.cardhead[aria-expanded=true] .chev{transform:translateY(-50%) rotate(90deg)}
.sum,.sub{font-size:13px;color:var(--text-2);margin:4px 0 0;text-align:center;font-variant-numeric:tabular-nums}

/* Aufklappen */
.collapsible{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s var(--ease)}
.collapsible.open{grid-template-rows:1fr}
.collapsible > .inner{overflow:hidden;min-height:0}

.field{margin-top:11px}
.field > label,.lbl{display:block;font-size:12.5px;color:var(--text-2);margin-bottom:5px;text-align:center}
.hint{font-size:12px;color:var(--text-3);margin-top:6px;line-height:1.35;text-align:center}
.row{display:flex;gap:10px;align-items:flex-start}
.grow{flex:1;min-width:0}

input[type=time],input[type=number],input[type=text],textarea{
  width:100%;background:var(--inset);border:1px solid var(--hairline);border-radius:var(--radius-s);
  padding:9px 12px;min-height:42px;appearance:none;-webkit-appearance:none;text-align:center
}
textarea{min-height:42px;resize:vertical;line-height:1.38;text-align:left}
input:focus,textarea:focus{border-color:var(--accent);background:var(--surface-2);outline:none}
input[type=time]{font-variant-numeric:tabular-nums;font-weight:600}

.seg{position:relative;display:flex;gap:4px;background:var(--inset);padding:3px;border-radius:13px}
.seg .thumb{
  position:absolute;top:3px;bottom:3px;left:3px;border-radius:10px;pointer-events:none;
  background:var(--surface-2);box-shadow:0 1px 3px rgba(0,0,0,.45);opacity:0;
  transition:transform .34s var(--ease), width .34s var(--ease), background .22s var(--ease), opacity .18s
}
.seg button{
  position:relative;z-index:1;flex:1;min-height:36px;border-radius:10px;
  font-size:14px;font-weight:520;color:var(--text-2);transition:color .2s var(--ease),font-weight .2s
}
.seg button[aria-pressed=true]{color:var(--text);font-weight:640}
.seg.compact button{font-size:13px;min-height:33px}
.segmeaning{font-size:12px;color:var(--text-3);margin-top:6px;min-height:15px;text-align:center}

.chips{display:flex;flex-wrap:wrap;gap:7px;justify-content:center}
.chip{
  min-height:34px;padding:0 12px;border-radius:18px;background:var(--inset);border:1px solid var(--hairline);
  font-size:14px;color:var(--text-2);display:inline-flex;align-items:center
}
.chip[aria-pressed=true]{background:var(--accent-soft);border-color:rgba(242,176,61,.45);color:var(--accent-2);font-weight:560}
.chip.warn[aria-pressed=true]{background:var(--warn-soft);border-color:rgba(242,96,122,.45);color:var(--warn)}

.ghost{
  min-height:40px;padding:0 16px;border-radius:var(--radius-s);
  background:var(--inset);border:1px solid var(--hairline);
  font-size:15px;font-weight:560;color:var(--accent-2);
  display:inline-flex;align-items:center;justify-content:center;gap:7px;width:100%
}
.ghost.small{min-height:36px;font-size:13.5px}
.ghost.danger{color:#ff7a6b}

/* Wirkverlauf */
.verlauf{margin-top:13px;padding-top:13px;border-top:1px solid var(--hairline)}
.vh{margin:0 0 10px;font-size:14.5px;font-weight:640;text-align:center}
.window{display:flex;gap:11px}
.wbox{flex:1;min-width:0;background:var(--inset);border:1px solid var(--hairline);border-radius:var(--radius-s);padding:9px 8px;text-align:center}
.wbox .lbl{margin-bottom:7px;display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap}
.wval{display:flex;align-items:center;gap:4px}
.wval input.v{
  flex:1;min-width:0;background:none;border:0;padding:0;min-height:34px;
  font-size:19px;font-weight:680;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:-.01em;color:var(--text)
}
.wval input.v.suggested{color:var(--text-3);font-weight:600}
.wval input.v:focus{background:none;border:0}
.stp{width:32px;height:32px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;color:var(--accent-2);font-size:17px;font-weight:600;flex:none}
.badge{font-size:9.5px;font-weight:720;padding:2px 6px;border-radius:5px;background:var(--accent-soft);color:var(--accent-2)}
.badge.dashed{background:transparent;border:1px dashed var(--text-3);color:var(--text-3)}
.derived{margin-top:10px;display:flex;gap:20px;justify-content:center;font-size:13px;color:var(--text-2)}
.derived b{color:var(--text);font-weight:640;font-variant-numeric:tabular-nums}

.strip-wrap{position:relative;margin:13px 0 0}
.strip{display:flex;gap:3px;height:32px}
.strip .cell{flex:1;border-radius:6px;background:var(--inset);position:relative;transition:background .3s var(--ease)}
.strip .cell[data-r="0"]{background:var(--r0)}
.strip .cell[data-r="1"]{background:var(--r1)}
.strip .cell[data-r="2"]{background:var(--r2)}
.strip .cell[data-r="3"]{background:var(--r3)}
.strip .cell.late::after{content:"";position:absolute;top:5px;right:5px;width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.7)}
.bracket{position:absolute;left:0;right:0;bottom:-9px;height:9px;pointer-events:none}
.bracket div{position:absolute;height:3px;bottom:2px;background:var(--accent);border-radius:2px;transition:left .3s var(--ease),width .3s var(--ease)}
.ticks{display:flex;gap:3px;margin-top:11px}
.ticks span{flex:1;text-align:center;font-size:10.5px;color:var(--text-3);font-variant-numeric:tabular-nums}

.disclose{
  margin-top:12px;width:100%;min-height:40px;border-radius:var(--radius-s);
  background:var(--inset);border:1px solid var(--hairline);
  display:flex;align-items:center;justify-content:center;gap:9px;padding:0 13px;
  font-size:14px;font-weight:560;color:var(--text-2)
}
.disclose .chev{color:var(--accent-2);font-size:12px;transition:transform .28s var(--ease)}
.disclose[aria-expanded=true] .chev{transform:rotate(90deg)}
/* Dosis-Kacheln, symmetrisch zur Uhrzeitspalte */
.dosegrid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.dosetile{
  min-height:41px;border-radius:var(--radius-s);background:var(--inset);border:1px solid var(--hairline);
  display:grid;place-items:center;color:var(--text-2);
  transition:background .16s var(--ease),border-color .16s,color .16s
}
.dosetile .in{display:flex;align-items:baseline;gap:3px;line-height:1}
.dosetile .n{font-size:17px;font-weight:660;font-variant-numeric:tabular-nums;line-height:1}
.dosetile .u{font-size:12px;font-weight:520;line-height:1}
.dosetile[aria-pressed=true]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-2)}

/* Wirkverlauf-Einträge */
.entries{display:flex;flex-direction:column;gap:8px;padding-top:10px}
.entry{border-radius:var(--radius-s);background:var(--inset);border:1px solid var(--hairline);padding:9px}
.entry-head{display:flex;align-items:center;gap:9px;margin-bottom:8px}
.entry-head input.et{
  flex:none;width:auto;min-width:88px;min-height:34px;padding:5px 9px;
  background:var(--surface-2);font-size:15px;font-weight:640;font-variant-numeric:tabular-nums
}
.entry-head input.ep{
  flex:none;width:auto;min-width:74px;max-width:84px;min-height:34px;padding:5px 8px;
  background:var(--surface-2);font-size:14px;font-variant-numeric:tabular-nums
}
.entry-head .del{margin-left:auto;font-size:12.5px;color:var(--text-3)}
.entry .seg{background:var(--surface-2)}
.entry .seg button{min-height:34px;font-size:12.5px}
.entry textarea{margin-top:9px;background:var(--surface-2)}
.entry .ghost{margin-top:9px}
.addentry{
  min-height:46px;border-radius:var(--radius-s);border:1.5px dashed rgba(255,255,255,.18);
  background:none;color:var(--accent-2);font-size:14.5px;font-weight:560;
  display:flex;align-items:center;justify-content:center;transition:border-color .16s,background .16s
}
.addentry:hover{border-color:var(--accent);background:var(--accent-soft)}
.late-flag{font-size:11px;color:var(--warn);font-weight:600}

/* Tagesabschluss */
.wingroup{margin-top:9px}
.wingroup:first-of-type{margin-top:11px}
.wingroup-head{
  position:relative;display:flex;align-items:center;justify-content:center;gap:10px;
  width:100%;padding:10px 30px;border-radius:var(--radius-s);background:var(--accent-soft)
}
.wingroup-head .chev{position:absolute;right:11px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--text-3);transition:transform .28s var(--ease)}
.wingroup-head[aria-expanded=true] .chev{transform:translateY(-50%) rotate(90deg)}
.wingroup .collapsible > .inner{padding-top:9px}
.wdone{font-size:11px;font-weight:660;color:var(--text-3)}
.wingroup-head .nm{font-size:14px;font-weight:680;color:var(--accent-2)}
.wingroup-head .when{font-size:12.5px;color:var(--text-2);font-variant-numeric:tabular-nums}
.aspect{background:var(--inset);border:1px solid var(--hairline);border-radius:var(--radius-s);padding:11px;margin-bottom:7px}
.aspect .ah{text-align:center;margin-bottom:9px}
.aspect .ah .an{font-size:13.5px;font-weight:640;display:block}
.aspect .ah .ax{font-size:12px;color:var(--text-3);display:block;margin-top:2px}
.aspect .seg,.aspect .chip{background:var(--surface-2)}
.aspect textarea,.aspect input{background:var(--surface-2)}
.aspect .field:first-of-type{margin-top:12px}
.stepper{display:flex;align-items:center;justify-content:center;gap:12px}
.stepper .v{font-size:21px;font-weight:680;min-width:30px;text-align:center;font-variant-numeric:tabular-nums}
.addrow{display:flex;gap:8px;margin-top:10px}
.addrow input{min-height:38px;padding:7px 11px}
.addrow button{flex:none;min-height:38px;padding:0 14px;border-radius:var(--radius-s);background:var(--accent-soft);color:var(--accent-2);font-size:14px;font-weight:600}
.resetbtn{font-size:12.5px;color:var(--text-3);margin-top:9px;display:block;width:100%;text-align:center}
.wreset{font-size:12.5px;color:var(--accent-2);margin-top:9px;display:block;width:100%;text-align:center}

/* Übersicht */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.kpi{background:var(--inset);border:1px solid var(--hairline);border-radius:var(--radius-s);padding:13px;text-align:center}
.kpi .k{font-size:12.5px;color:var(--text-2);margin-bottom:4px}
.kpi .v{font-size:25px;font-weight:700;letter-spacing:-.022em;font-variant-numeric:tabular-nums;line-height:1.15}
.kpi .v small{font-size:14px;font-weight:520;color:var(--text-2);letter-spacing:0}
.kpi .d{font-size:12px;margin-top:4px;color:var(--text-3);font-variant-numeric:tabular-nums}
.kpi .d.up{color:var(--accent-2)}
.kpi .d.down{color:var(--warn)}
.kpi svg{display:block;margin-top:9px;width:100%;height:26px;overflow:visible}
.kpi svg polyline{fill:none;stroke:var(--accent);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
table.tbl{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
table.tbl th{text-align:right;font-weight:560;color:var(--text-2);font-size:12px;padding:0 0 8px;border-bottom:1px solid var(--hairline)}
table.tbl th:first-child,table.tbl td:first-child{text-align:left}
table.tbl td{padding:10px 0;border-bottom:1px solid var(--hairline);text-align:right}
table.tbl tr:last-child td{border-bottom:0}
table.tbl tr.thin td{color:var(--text-3)}
table.tbl .n{font-size:11.5px;color:var(--text-3);font-weight:400}
.scroll-x{overflow-x:auto;margin:0 calc(var(--sp) * -1);padding:0 var(--sp)}
.scroll-x table{min-width:420px}
.bars{display:flex;flex-direction:column;gap:9px}
.bar{display:flex;align-items:center;gap:10px;font-size:13.5px}
.bar .nm{flex:none;width:128px;color:var(--text-2);text-align:left}
.bar .tr{flex:1;height:7px;border-radius:4px;background:var(--inset);overflow:hidden}
.bar .fl{height:100%;background:var(--warn);border-radius:4px}
.bar .ct{flex:none;font-size:12.5px;color:var(--text-3);font-variant-numeric:tabular-nums;min-width:38px;text-align:right}
.empty{text-align:center;padding:34px 16px;color:var(--text-2)}
.empty p{margin:0 0 4px;font-size:15px}
.empty .big{font-size:17px;color:var(--text);font-weight:600}
.danger-zone{border-color:rgba(242,96,122,.34);background:linear-gradient(180deg,rgba(242,96,122,.07) 0,rgba(0,0,0,0) 96px),var(--surface)}
.danger-zone h2{color:var(--warn);justify-content:center}
.danger-zone .ghost.danger{border-color:rgba(242,96,122,.4);background:rgba(242,96,122,.10);color:var(--warn)}

<body>

<div class="toast" id="savedHint" role="status" aria-live="polite"></div>

<main>
  <section id="view-tracking"></section>
  <section id="view-uebersicht" class="hidden"></section>
  <section id="view-daten" class="hidden"></section>
</main>

<div class="tabbar">
  <nav class="tabs" role="tablist">
    <div class="tthumb" id="tthumb"></div>
    <button role="tab" data-tab="tracking" aria-selected="true">
      <svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h7M4 6h.01M4 12h.01M4 18h.01"/></svg><span>Tracking</span></button>
    <button role="tab" data-tab="uebersicht" aria-selected="false">
      <svg viewBox="0 0 24 24"><path d="M4 19V10M10 19V5M16 19v-6M21 19H3"/></svg><span>Dashboard</span></button>
    <button role="tab" data-tab="daten" aria-selected="false">
      <svg viewBox="0 0 24 24"><path d="M12 3v12m0 0 4-4m-4 4-4-4M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg><span>Daten</span></button>
  </nav>
  <button class="fab" id="fab" aria-label="Schnell erfassen">
    <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
  </button>
</div>

<script>
"use strict";

/* ===================== Konstanten ===================== */
const SCHEMA = 1;
const HOURS = 6;                 // Stundenzeilen je Einnahme
const DAY_START_HOUR = 4;        // Tagesgrenze 04:00
const LATE_MIN = 90;             // ab hier gilt eine Stundenzeile als nachgetragen

const R_LABELS = ["keine","lässt nach","wirkt","deutlich"];
const INIT_MEAN = ["gar nicht angefangen","erst nach langem Wegdrücken","angefangen, mit Reibung","ohne nennenswerte Reibung"];
const END_MEAN  = ["sofort abgedriftet","ständiger Wechsel","mit Unterbrechungen durchgehalten","durchgehend"];
const SIDE_EFFECTS = ["Druck Kopfseiten","Druck Brust","Mundtrockenheit","Kopfschmerzen","Angstgefühl","Appetit vermindert","Herzklopfen","Reizbarkeit"];
const SE_SHOWN = 4;
const STATUS = [
  { v:"arbeit", t:"Arbeit",            d:"M3 8h18v11a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z|M9 8V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v3" },
  { v:"reise",  t:"Dienstreise",       d:"M3 15h18|M5 15l1.5-5h11L19 15|M7 19v-1|M17 19v-1|M8 10V7h8v3" },
  { v:"frei",   t:"Wochenende/Urlaub", d:"M12 3v2|M12 19v2|M5 12H3|M21 12h-2|M6.3 6.3 4.9 4.9|M19.1 19.1l-1.4-1.4|M6.3 17.7l-1.4 1.4|M19.1 4.9l-1.4 1.4|M16 12a4 4 0 1 1-8 0 4 4 0 0 1 8 0" }
];
const statusLabel = v => (STATUS.find(x => x.v === v) || {}).t || "Ohne Status";

// Zuletzt tatsächlich benutzte Nebenwirkungen, neueste zuerst, aufgefüllt mit den Vorgaben.
function recentSideEffects(){
  const seen = [];
  Object.values(state.days).sort((a,b) => a.date < b.date ? 1 : -1).forEach(d => {
    ["f1","f2"].forEach(k => (d.review[k].se || []).forEach(x => {
      if (!seen.some(y => y.toLowerCase() === x.toLowerCase())) seen.push(x);
    }));
  });
  const out = seen.slice(0, SE_SHOWN);
  for (const def of SIDE_EFFECTS){
    if (out.length >= SE_SHOWN) break;
    if (!out.some(y => y.toLowerCase() === def.toLowerCase())) out.push(def);
  }
  return out;
}
const normSE = t => t.trim().replace(/\s+/g," ");
const DOSE_CHIPS = [10,20,30,40];

/* ===================== Speicher ===================== */
const IDB = (() => {
  let dbp = null;
  function open(){
    if (dbp) return dbp;
    dbp = new Promise((res, rej) => {
      const r = indexedDB.open("wirkungslog", 1);
      r.onupgradeneeded = () => r.result.createObjectStore("kv");
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
    return dbp;
  }
  return {
    async get(){
      const db = await open();
      return new Promise((res, rej) => {
        const t = db.transaction("kv","readonly").objectStore("kv").get("state");
        t.onsuccess = () => res(t.result || null); t.onerror = () => rej(t.error);
      });
    },
    async set(_k, v){
      const db = await open();
      return new Promise((res, rej) => {
        const t = db.transaction("kv","readwrite").objectStore("kv").put(v, "state");
        t.onsuccess = () => res(); t.onerror = () => rej(t.error);
      });
    }
  };
})();

let state = null;
let currentDate = null;
let currentTab = "tracking";
let saveTimer = null;

function blankDose(){
  return { taken:null, time:null, mg:null, plan:"", pulse:null,
           checks:[],                       // { t:"HH:MM", r:0..3, note, at }
           onset:null, offset:null, confirmed:false };
}
// Altbestand aus dem festen 6-Stunden-Raster in freie Einträge überführen
function migrate(st){
  Object.values(st.days || {}).forEach(d => (d.doses || []).forEach(dz => {
    if (dz.pulse === undefined) dz.pulse = null;
    if (Array.isArray(dz.checks)){ dz.checks.forEach(c => { if (!c.id) c.id = newId(); if (c.pulse === undefined) c.pulse = null; }); return; }
    dz.checks = [];
    if (Array.isArray(dz.hours) && dz.time){
      dz.hours.forEach((hr,i) => {
        if (hr && hr.r != null)
          dz.checks.push({ id: newId(), t: toHM(toMin(dz.time) + (i+1)*60), r: hr.r, note: hr.note || "", pulse: null, at: hr.at || null });
      });
    }
    delete dz.hours;
  }));
}
function blankRating(){
  return { init:null, endur:null, avoid:null, avoidWhy:"", impulses:null, se:[], note:"" };
}
function blankDay(date){
  return { date, updatedAt:new Date().toISOString(), status:null,
           doses:[blankDose(),blankDose()],
           review:{ f1:blankRating(), f2:blankRating() } };
}
function blankState(){
  return { schema:SCHEMA, days:{}, meta:{ created:new Date().toISOString(), lastExport:null } };
}

async function load(){
  const raw = await IDB.get();
  state = raw && raw.schema ? raw : blankState();
  migrate(state);
  if (!state.meta) state.meta = { created:new Date().toISOString(), lastExport:null };
}
function touchDay(d){ if (state.days[d]) state.days[d].updatedAt = new Date().toISOString(); }
function save(dateTouched){
  if (dateTouched) touchDay(dateTouched);
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    try { await IDB.set("state", state); flashSaved("Gespeichert"); }
    catch(e){ flashSaved("Nicht gespeichert. Speicher blockiert."); }
  }, 260);
}
let savedTimer = null;
function flashSaved(msg){
  const el = document.getElementById("savedHint");
  if (!el) return;
  el.textContent = msg; el.classList.add("on");
  clearTimeout(savedTimer);
  savedTimer = setTimeout(() => el.classList.remove("on"), 1600);
}

/* ===================== Datum & Zeit ===================== */
function logicalToday(){
  const n = new Date();
  if (n.getHours() < DAY_START_HOUR) n.setDate(n.getDate()-1);
  return iso(n);
}
function iso(d){
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function fromIso(s){ const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); }
function shiftDate(s, n){ const d = fromIso(s); d.setDate(d.getDate()+n); return iso(d); }
function nowHM(){ const d = new Date(); return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"); }
function toMin(hm){ if(!hm) return null; const [h,m] = hm.split(":").map(Number); return h*60+m; }
function toHM(min){
  if (min == null) return null;
  const m = ((min % 1440) + 1440) % 1440;
  return String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0");
}
function dur(min){
  if (min == null) return "–";
  const s = min < 0 ? "-" : "", a = Math.abs(min);
  return s + (a >= 60 ? Math.floor(a/60)+" h "+(a%60 ? String(a%60)+" min" : "") : a+" min").trim();
}
const WD = ["So","Mo","Di","Mi","Do","Fr","Sa"];
function dateLabel(s){
  const t = logicalToday();
  if (s === t) return "Heute";
  if (s === shiftDate(t,-1)) return "Gestern";
  const d = fromIso(s);
  return WD[d.getDay()]+", "+d.getDate()+"."+(d.getMonth()+1)+".";
}

/* ===================== Ableitungen ===================== */
let idSeq = 0;
const newId = () => Date.now().toString(36) + (idSeq++).toString(36);
function sortedChecks(dose){
  return (dose.checks || []).slice().sort((a,b) => toMin(a.t) - toMin(b.t));
}
const doseActive = d => d.taken !== false;
function suggestion(dose){
  if (!doseActive(dose)) return { onset:null, offset:null };
  const on = sortedChecks(dose).filter(c => c.r != null && c.r >= 2);
  if (!on.length) return { onset:null, offset:null };
  return { onset:on[0].t, offset:on[on.length-1].t };
}
// Welcher Streifenabschnitt gehört zu diesem Eintrag? Abschnitt i endet bei Einnahme + (i+1) h.
function bucketOf(dose, c){
  if (!dose.time) return null;
  const d = toMin(c.t) - toMin(dose.time);
  if (d < 0) return null;
  return Math.min(HOURS - 1, Math.max(0, Math.ceil(d / 60) - 1));
}
function bucketRatings(dose){
  const out = Array(HOURS).fill(null), late = Array(HOURS).fill(false);
  sortedChecks(dose).forEach(c => {
    const b = bucketOf(dose, c);
    if (b == null || c.r == null) return;
    out[b] = c.r; late[b] = checkLate(c);
  });
  return { out, late };
}
// Wirkbeginn nie vor der Einnahme, Wirkende nie vor Einnahme oder Wirkbeginn.
// Gibt zurück, ob der Wunschwert angepasst werden musste.
function setWindowTime(dose, key, hm){
  if (!hm) return false;
  const sug = suggestion(dose);
  const t0 = dose.time ? toMin(dose.time) : null;
  let v = toMin(hm), clamped = false;
  if (key === "onset"){
    if (t0 != null && v < t0){ v = t0; clamped = true; }
    const off = dose.offset || sug.offset;
    if (off && v > toMin(off)){ v = toMin(off); clamped = true; }
    dose.onset = toHM(v);
  } else {
    const on = dose.onset || sug.onset;
    const floor = on != null ? toMin(on) : t0;
    if (floor != null && v < floor){ v = floor; clamped = true; }
    dose.offset = toHM(v);
  }
  dose.confirmed = true;
  return clamped;
}
function resetWindow(dose){ dose.onset = null; dose.offset = null; dose.confirmed = false; }

function checkLate(c){
  if (!c.at || !c.t) return false;
  const at = new Date(c.at);
  return (at.getHours()*60 + at.getMinutes()) - toMin(c.t) > LATE_MIN;
}
function effWindow(dose){
  const s = suggestion(dose);
  if (!doseActive(dose)) return { onset:null, offset:null, isSuggested:true, suggestion:s };
  return { onset: dose.onset || s.onset, offset: dose.offset || s.offset,
           isSuggested: !dose.confirmed, suggestion:s };
}
function metrics(day){
  const [d1,d2] = day.doses;
  const w1 = effWindow(d1), w2 = effWindow(d2);
  const lat = (d,w) => (d.time && w.onset) ? toMin(w.onset)-toMin(d.time) : null;
  const len = w => (w.onset && w.offset) ? toMin(w.offset)-toMin(w.onset) : null;
  const gap = (w1.offset && w2.onset) ? toMin(w2.onset)-toMin(w1.offset) : null;
  return { lat1:lat(d1,w1), lat2:lat(d2,w2), len1:len(w1), len2:len(w2), gap,
           cover:(w1.onset && w2.offset) ? toMin(w2.offset)-toMin(w1.onset) : null };
}
function hourClock(dose, i){ return dose.time ? toHM(toMin(dose.time) + (i+1)*60) : null; }
let hoursOpen = [false, false];   // Stundenraster startet immer zugeklappt
let openBlock = null;             // 0, 1 oder 2 (Tagesabschluss). null = automatisch
let openWin = null;               // 0 oder 1 im Tagesabschluss, -1 = beide zu
function autoWin(day){
  const done = k => day.review[k].init != null && day.review[k].endur != null;
  if (!done("f1")) return 0;
  if (!done("f2")) return 1;
  return 0;
}
function setOpenWin(n){
  openWin = (openWin === n) ? -1 : n;
  document.querySelectorAll("#view-tracking .collapsible[data-win]").forEach(el => {
    const on = Number(el.dataset.win) === openWin;
    el.classList.toggle("open", on);
    const head = el.previousElementSibling;
    if (head) head.setAttribute("aria-expanded", String(on));
  });
}
function autoBlock(day){
  for (let i = 0; i < 2; i++){
    const d = day.doses[i];
    if (d.taken === null) return i;
    if (d.taken === true && isWindowLive(d)) return i;
  }
  const done = d => d.taken === false || (d.time && d.mg != null && effWindow(d).onset && effWindow(d).offset);
  if (!done(day.doses[0])) return 0;
  if (!done(day.doses[1])) return 1;
  return 2;
}
// Akkordeon ohne Neuaufbau umschalten, sonst laeuft die Animation nicht
function setOpenBlock(n){

    if (head) head.setAttribute("aria-expanded", String(on));

}   // null = automatisch, true/false = vom Nutzer umgeschaltet
function isWindowLive(dose){
  if (!dose.time || currentDate !== logicalToday()) return false;
  const now = new Date().getHours()*60 + new Date().getMinutes();
  const t0 = toMin(dose.time);
  return now >= t0 && now <= t0 + HOURS*60;
}

// Puls: Ausgangswert vor der Einnahme, Mittel der Werte im Fenster, Differenz
const PULSE_FROM = 60, PULSE_TO = 180;     // Messfenster in Minuten nach der Einnahme
function pulseOf(dose){
  const empty = { pre:null, win:null, delta:null, n:0 };
  if (!doseActive(dose)) return empty;
  const pre = dose.pulse != null ? dose.pulse : null;
  if (!dose.time) return { pre, win:null, delta:null, n:0 };
  const t0 = toMin(dose.time);
  const vals = (dose.checks || []).filter(c => {
    if (c.pulse == null || Number.isNaN(c.pulse)) return false;
    const d = toMin(c.t) - t0;
    return d >= PULSE_FROM && d <= PULSE_TO;
  }).map(c => c.pulse);
  const win = vals.length ? vals.reduce((a,b)=>a+b,0) / vals.length : null;
  return { pre, win, delta: (pre != null && win != null) ? win - pre : null, n: vals.length };
}
function dayHasData(day){
  return day.doses.some(d => d.taken !== null || d.time || d.mg || d.pulse != null || (d.checks || []).length)
      || ["f1","f2"].some(k => { const r = day.review[k];
           return r.init != null || r.endur != null || r.avoid != null || r.impulses != null || r.se.length || r.note; });
}
function doseLabel(day){
  const [a,b] = day.doses;
  const f = d => d.taken === false ? "0" : (d.mg != null ? String(d.mg) : "?");
  if (a.taken === null && b.taken === null && a.mg == null && b.mg == null) return null;
  return f(a)+" + "+f(b)+" mg";
}

const h = (tag, attrs = {}, ...kids) => {
  const e = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs)){
    if (v == null || v === false) continue;
    if (k === "class") e.className = v;
    else if (k === "html") e.innerHTML = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? "" : v);
  }
  kids.flat().forEach(k => k != null && e.append(k.nodeType ? k : document.createTextNode(k)));
  return e;
};
const SCALE_COLORS = [   // schlecht nach gut, zwei Farbtöne mit Zwischenschritten
  { bg:"#d9556c", fg:"#fff" }, { bg:"#b8794f", fg:"#fff" },
  { bg:"#7ba585", fg:"#0e1512" }, { bg:"#3fbf95", fg:"#0e1512" }];
const WIRK_COLORS = [    // gleiche Farben wie der Streifen
  { bg:"var(--r0)", fg:"rgba(235,242,255,.9)" }, { bg:"var(--r1)", fg:"#fff" },
  { bg:"var(--r2)", fg:"#231803" }, { bg:"var(--r3)", fg:"#231803" }];
const thumbMemo = new Map();   // letzte Position je Steuerelement, damit der Schieber gleitet

function segmented(opts, value, onPick, extraClass = "", key = null, colors = null){
  const wrap = h("div", { class:"seg " + extraClass });
  const thumb = h("div", { class:"thumb" });
  wrap.append(thumb);
  const n = opts.length;
  const place = i => {
    if (i < 0){ thumb.style.opacity = "0"; return; }
    thumb.style.opacity = "1";
    thumb.style.width = "calc((100% - 6px - " + ((n-1)*4) + "px) / " + n + ")";
    thumb.style.transform = "translateX(calc(" + i + " * (100% + 4px)))";
    if (colors && colors[i]) thumb.style.background = colors[i].bg;
  };
  const idx = opts.findIndex(o => o.v === value);
  const prev = key != null && thumbMemo.has(key) ? thumbMemo.get(key) : idx;
  if (prev !== idx && prev >= 0){
    thumb.style.transition = "none";
    place(prev);
    requestAnimationFrame(() => { thumb.style.transition = ""; place(idx); });
  } else place(idx);
  if (key != null) thumbMemo.set(key, idx);

  opts.forEach((o,i) => {
    const on = value === o.v;
    wrap.append(h("button", {
      type:"button", "aria-pressed":String(on),
      style: on && colors && colors[i] ? "color:" + colors[i].fg : null,
      onclick:() => onPick(on ? null : o.v)
    }, o.t));
  });
  return wrap;
}

const REDUCED = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

function resetDayState(){ hoursOpen = [false,false]; openBlock = null; openWin = null; }

// Tageswechsel: alter Inhalt gleitet raus, neuer von der Gegenseite herein
function goToDate(next, dir){
  if (next === currentDate) return;
  const pane = document.getElementById("daypane");
  const apply = () => { currentDate = next; resetDayState(); renderTracking(); };
  if (!pane || REDUCED){ apply(); return; }
  pane.style.transition = "transform .17s var(--ease), opacity .17s var(--ease)";
  pane.style.transform = "translateX(" + (dir > 0 ? -30 : 30) + "px)";
  pane.style.opacity = "0";
  setTimeout(() => {
    apply();
    const p = document.getElementById("daypane");
    if (!p) return;
    p.style.transition = "none";
    p.style.transform = "translateX(" + (dir > 0 ? 30 : -30) + "px)";
    p.style.opacity = "0";
    requestAnimationFrame(() => {
      p.style.transition = "transform .3s var(--ease), opacity .26s var(--ease)";
      p.style.transform = "translateX(0)";
      p.style.opacity = "1";
    });
  }, 170);
}

function renderTracking(){
  const root = document.getElementById("view-tracking");
  root.textContent = "";
  if (!state.days[currentDate]) state.days[currentDate] = blankDay(currentDate);
  const day = state.days[currentDate];
  if (openBlock === null) openBlock = autoBlock(day);
  if (openWin === null) openWin = autoWin(day);

  const pick = h("input", { type:"date", value:currentDate, "aria-label":"Datum wählen",
    onclick:e => { e.stopPropagation(); try { e.target.showPicker(); } catch(err){} },
    onchange:e => { if (!e.target.value) return;
      const v = e.target.value > logicalToday() ? logicalToday() : e.target.value;
      goToDate(v, v > currentDate ? 1 : -1); }});
  const cal = document.createElementNS("http://www.w3.org/2000/svg","svg");
  cal.setAttribute("viewBox","0 0 24 24");
  ["M4 6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v13a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1z","M4 9h16","M8 3v3","M16 3v3"]
    .forEach(d => { const p = document.createElementNS("http://www.w3.org/2000/svg","path"); p.setAttribute("d",d); cal.append(p); });
  root.append(h("div", { class:"datebar" },
    h("button", { class:"arrow", "aria-label":"Vorheriger Tag",

      cal, h("span", {}, dateLabel(currentDate)), pick),

      onclick:() => { if (currentDate < logicalToday()) goToDate(shiftDate(currentDate,1), 1); }}, "›")));

  const pane = h("div", { class:"daypane", id:"daypane" });

  const statusBtns = [];
  const statusRow = h("div", { class:"status" }, STATUS.map(o => {
    const svg = document.createElementNS("http://www.w3.org/2000/svg","svg");

    const btn = h("button", { type:"button", "data-s":o.v, "aria-pressed":String(day.status === o.v),
      onclick:() => {

          setTimeout(() => btn.classList.remove("lit"), 700);
        }
      }},
      h("span", { class:"glow" }), h("span", { class:"flash" }), svg, h("span", {}, o.t));
    statusBtns.push(btn);
    return btn;
  }));

  pane.append(statusRow, doseCard(day, 0), doseCard(day, 1), reviewCard(day));
  attachSwipe(pane);
  root.append(pane);
}

// Wischen nach links oder rechts wechselt den Tag
function attachSwipe(pane){
  let x0 = null, y0 = null, active = false, moved = false;
  pane.addEventListener("pointerdown", e => {
    if (e.pointerType === "mouse" && e.button !== 0) return;
    x0 = e.clientX; y0 = e.clientY; active = false; moved = false;
  });
  pane.addEventListener("pointermove", e => {
    if (x0 == null) return;
    const dx = e.clientX - x0, dy = e.clientY - y0;
    if (!active){
      if (Math.abs(dy) > Math.abs(dx)){ x0 = null; return; }   // vertikales Scrollen gewinnt
      if (Math.abs(dx) < 14 || Math.abs(dx) < Math.abs(dy) * 1.6) return;
      active = true;
    }
    moved = true;
    pane.style.transition = "none";
    pane.style.transform = "translateX(" + (dx * 0.55) + "px)";
    pane.style.opacity = String(Math.max(.5, 1 - Math.abs(dx)/420));
  });
  const end = e => {
    if (x0 == null){ return; }
    const dx = e.clientX - x0;
    x0 = null;
    if (!active) return;
    pane.style.transition = "transform .26s var(--ease), opacity .26s var(--ease)";
    pane.style.transform = "translateX(0)";
    pane.style.opacity = "1";
    if (Math.abs(dx) > 70){
      if (dx > 0) goToDate(shiftDate(currentDate,-1), -1);
      else if (currentDate < logicalToday()) goToDate(shiftDate(currentDate,1), 1);
      else flashSaved("Das ist schon heute");
    }
    active = false;
  };
  pane.addEventListener("pointerup", end);
  pane.addEventListener("pointercancel", () => { x0 = null; active = false;
    pane.style.transition = "transform .26s var(--ease), opacity .26s"; pane.style.transform = ""; pane.style.opacity = ""; });
  // nach einem Wisch keinen Klick auslösen
  pane.addEventListener("click", e => { if (moved){ e.stopPropagation(); e.preventDefault(); moved = false; } }, true);
}

function verlaufBlock(dose, idx){
  const box = h("div", { class:"verlauf", id:"verlauf"+idx });
  box.append(h("h3", { class:"vh" }, "Wirkverlauf"));

  const w = effWindow(dose);
  const mk = (key, label) => {
    const val = dose[key] || w.suggestion[key];
    const isSug = !dose[key] && !!val;
    const set = v => {
      const clamped = setWindowTime(dose, key, v);
      save(currentDate); renderTracking();
      if (clamped) flashSaved(key === "onset"
        ? "Wirkbeginn kann nicht vor der Einnahme liegen"
        : "Wirkende kann nicht vor dem Wirkbeginn liegen");
    };
    const bump = n => set(toHM(toMin(dose[key] || w.suggestion[key] || dose.time) + n));
    const inp = h("input", { type:"time", class:"v" + (isSug ? " suggested" : ""), value: val || "",
      "aria-label":label, onchange:e => { if (e.target.value) set(e.target.value); }});
    return h("div", { class:"wbox" },
      h("span", { class:"lbl" }, label, isSug ? h("span", { class:"badge dashed" }, "Vorschlag") : null),
      h("div", { class:"wval" },
        h("button", { class:"stp", type:"button", "aria-label":label+" früher", onclick:() => bump(-15) }, "−"),
        inp,
        h("button", { class:"stp", type:"button", "aria-label":label+" später", onclick:() => bump(15) }, "+")));
  };
  box.append(h("div", { class:"window" }, mk("onset","Wirkbeginn"), mk("offset","Wirkende")));
  if (dose.confirmed) box.append(h("button", { class:"wreset", type:"button", onclick:() => {
    resetWindow(dose); save(currentDate); renderTracking(); flashSaved("Zurückgesetzt");
  }}, w.suggestion.onset || w.suggestion.offset ? "Auf Vorschlag zurücksetzen" : "Zeiten entfernen"));

  const lat = (dose.time && w.onset) ? toMin(w.onset)-toMin(dose.time) : null;
  const len = (w.onset && w.offset) ? toMin(w.offset)-toMin(w.onset) : null;
  box.append(h("div", { class:"derived" },
    h("span", {}, "Latenz ", h("b", {}, dur(lat))),
    h("span", {}, "Wirkdauer ", h("b", {}, dur(len)))));
  if (dose.confirmed && (w.suggestion.onset || w.suggestion.offset)){
    const dOn = (dose.onset && w.suggestion.onset) ? toMin(dose.onset)-toMin(w.suggestion.onset) : 0;
    const dOff = (dose.offset && w.suggestion.offset) ? toMin(dose.offset)-toMin(w.suggestion.offset) : 0;
    if (dOn || dOff) box.append(h("p", { class:"hint" },
      "Abweichung von deinen Einträgen: Beginn " + (dOn>0?"+":"") + dOn + " min, Ende " + (dOff>0?"+":"") + dOff + " min."));
  }

  // Streifen: sechs Stunden ab Einnahme, gefärbt von den Einträgen, die hineinfallen
  const { out, late } = bucketRatings(dose);
  const strip = h("div", { class:"strip" });
  out.forEach((r,i) => strip.append(h("div", {
    class:"cell" + (late[i] ? " late" : ""),
    "data-r": r != null ? String(r) : null,
    title: r != null ? R_LABELS[r] : "kein Eintrag" })));
  const bracket = h("div", { class:"bracket" }, h("div"));
  box.append(h("div", { class:"strip-wrap" }, strip, bracket),
             h("div", { class:"ticks" }, out.map((_,i) => h("span", {}, hourClock(dose,i) || ""))));

  // Einträge: nur was du tatsächlich erfasst hast
  const list = sortedChecks(dose);
  const open = !!hoursOpen[idx];
  const wrap = h("div", { class:"collapsible" + (open ? " open" : "") });

    }, "compact", "d"+idx+"-c"+c.id, WIRK_COLORS));

  wrap.append(h("div", { class:"inner" }, inner));
  box.append(head, wrap);
  requestAnimationFrame(() => positionBracket(bracket, dose));

}

function positionBracket(bracket, dose){
  const bar = bracket.firstChild;
  const w = effWindow(dose);
  if (!dose.time || !w.onset || !w.offset){ bar.style.width = "0"; return; }
  const t0 = toMin(dose.time), span = HOURS*60;
  const a = Math.max(0, Math.min(1, (toMin(w.onset)-t0)/span));
  const b = Math.max(0, Math.min(1, (toMin(w.offset)-t0)/span));
  bar.style.left = (a*100)+"%";
  bar.style.width = (Math.max(0, b-a)*100)+"%";
}

let periodDays = 30;                 // 7, 30, 0 = alles, "custom"
let customFrom = null, customTo = null;
const dayDiff = (a,b) => Math.round((fromIso(b) - fromIso(a)) / 86400000);
function daysInRange(days, offset = 0){
  if (periodDays !== "custom") return inPeriod(days, periodDays, offset);
  if (!customFrom || !customTo) return offset === 0 ? days : [];
  const len = dayDiff(customFrom, customTo) + 1;
  const to   = offset ? shiftDate(customFrom, -1) : customTo;
  const from = offset ? shiftDate(to, -(len - 1)) : customFrom;
  return days.filter(d => d.date >= from && d.date <= to);
}

function sortedDays(){
  return Object.values(state.days).filter(dayHasData).sort((a,b) => a.date < b.date ? -1 : 1);
}
function inPeriod(days, n, offset = 0){
  if (n === 0) return offset === 0 ? days : [];
  const end = shiftDate(logicalToday(), -offset*n);
  const start = shiftDate(end, -(n-1));
  return days.filter(d => d.date >= start && d.date <= end);
}
const avg = arr => { const v = arr.filter(x => x != null && !Number.isNaN(x)); return v.length ? v.reduce((a,b)=>a+b,0)/v.length : null; };
const fmt1 = v => v == null ? "–" : (Math.round(v*10)/10).toString().replace(".",",");
const fmtMin = v => v == null ? "–" : Math.round(v) + " min";

// Nur Fenster zählen, deren Einnahme nicht ausgelassen wurde.
function rv(d, i, k, field){ return doseActive(d.doses[i]) ? d.review[k][field] : null; }
function collect(days){
  const m = days.map(metrics);
  const pick = (i,k,field) => days.filter(d => doseActive(d.doses[i])).map(d => d.review[k][field]);
  const bool = arr => arr.map(v => v == null ? null : (v ? 1 : 0));
  return {
    n: days.length,
    lat1: avg(m.map(x=>x.lat1)), lat2: avg(m.map(x=>x.lat2)),
    len1: avg(m.map(x=>x.len1)), len2: avg(m.map(x=>x.len2)),
    gap:  avg(m.map(x=>x.gap)),
    init1: avg(pick(0,"f1","init")),      init2: avg(pick(1,"f2","init")),
    end1:  avg(pick(0,"f1","endur")),     end2:  avg(pick(1,"f2","endur")),
    imp1:  avg(pick(0,"f1","impulses")),  imp2:  avg(pick(1,"f2","impulses")),
    avoid: avg(bool(pick(0,"f1","avoid")).concat(bool(pick(1,"f2","avoid"))))
  };
}
function sparkline(values){
  const v = values.filter(x => x != null);
  if (v.length < 2) return h("div", { style:"height:26px" });
  const mn = Math.min(...v), mx = Math.max(...v), rg = (mx-mn) || 1;
  const pts = v.map((y,i) => (i/(v.length-1)*100).toFixed(1) + "," + (24 - (y-mn)/rg*22).toFixed(1)).join(" ");
  const svg = document.createElementNS("http://www.w3.org/2000/svg","svg");
  svg.setAttribute("viewBox","0 0 100 26"); svg.setAttribute("preserveAspectRatio","none");
  const pl = document.createElementNS("http://www.w3.org/2000/svg","polyline");
  pl.setAttribute("points", pts); svg.append(pl);
  return svg;
}
function kpi(label, value, unit, delta, series, betterUp){
  let d = null;
  if (delta != null && Number.isFinite(delta) && Math.abs(delta) > 0.05){
    const good = betterUp == null ? null : (delta > 0) === betterUp;
    d = h("div", { class:"d " + (good == null ? "" : good ? "up" : "down") },
      (delta > 0 ? "▲ " : "▼ ") + fmt1(Math.abs(delta)) + " ggü. Vorzeitraum");
  }
  return h("div", { class:"kpi" },
    h("div", { class:"k" }, label),
    h("div", { class:"v" }, value, unit ? h("small", {}, " " + unit) : null),
    d, series ? sparkline(series) : null);
}

const AX0 = 6*60, AX1 = 22*60;                 // feste Achse 06:00 bis 22:00
const axPct = m => Math.max(0, Math.min(100, (m - AX0) / (AX1 - AX0) * 100));

function bar(cls, a, b, title){
  const el = h("div", { class:"tl-bar " + cls, title: title || "" });
  el.style.left = axPct(a) + "%";
  el.style.width = Math.max(2, axPct(b) - axPct(a)) + "%";
  return el;
}
function dot(cls, m, title){
  const el = h("div", { class:"tl-dot " + cls, title: title || "" });
  el.style.left = axPct(m) + "%";
  return el;
}
// Position so setzen, dass Beschriftungen an den Rändern nicht abgeschnitten werden
function placeX(el, pct){
  el.style.left = pct + "%";
  el.style.transform = pct < 6 ? "translateX(0)" : pct > 94 ? "translateX(-100%)" : "translateX(-50%)";
}
function axisRow(){
  const r = h("div", { class:"tl-axis" });
  for (let hh = 6; hh <= 22; hh += 4){
    const t = h("span", {}, String(hh).padStart(2,"0"));
    placeX(t, axPct(hh*60));
    r.append(t);
  }
  return r;
}

// Durchschnittstag: ein Streifen aus den Mittelwerten
function avgDayStrip(days){
  const g = (f) => avg(days.map(f).filter(v => v != null));
  const t1 = g(d => d.doses[0].time && doseActive(d.doses[0]) ? toMin(d.doses[0].time) : null);
  const t2 = g(d => d.doses[1].time && doseActive(d.doses[1]) ? toMin(d.doses[1].time) : null);
  const o1 = g(d => { const w = effWindow(d.doses[0]); return w.onset ? toMin(w.onset) : null; });
  const e1 = g(d => { const w = effWindow(d.doses[0]); return w.offset ? toMin(w.offset) : null; });
  const o2 = g(d => { const w = effWindow(d.doses[1]); return w.onset ? toMin(w.onset) : null; });
  const e2 = g(d => { const w = effWindow(d.doses[1]); return w.offset ? toMin(w.offset) : null; });
  if (o1 == null && o2 == null) return null;

  const lane = h("div", { class:"tl-lane tall" });
  if (t1 != null && o1 != null) lane.append(bar("lat", t1, o1, "Latenz 1"));
  if (o1 != null && e1 != null) lane.append(bar("w1", o1, e1, "Fenster 1"));
  if (e1 != null && o2 != null && o2 > e1) lane.append(bar("gap", e1, o2, "Loch"));
  if (t2 != null && o2 != null) lane.append(bar("lat", t2, o2, "Latenz 2"));
  if (o2 != null && e2 != null) lane.append(bar("w2", o2, e2, "Fenster 2"));
  if (t1 != null) lane.append(dot("d1", t1, "Einnahme 1"));
  if (t2 != null) lane.append(dot("d2", t2, "Einnahme 2"));

  // Werte als feste Legende statt als frei platzierte Marken: kollidiert nie
  const T = m => m == null ? "–" : toHM(Math.round(m));
  const gapMin = (e1 != null && o2 != null && o2 > e1) ? Math.round(o2 - e1) : null;
  const rows = [
    ["dot d1", "Einnahme 1", T(t1)],
    ["bar w1", "Fenster 1",  o1 == null ? "–" : T(o1) + " – " + T(e1)],
    ["bar gap","Loch",       gapMin == null ? "–" : dur(gapMin)],
    ["dot d2", "Einnahme 2", T(t2)],
    ["bar w2", "Fenster 2",  o2 == null ? "–" : T(o2) + " – " + T(e2)]
  ];
  const leg = h("div", { class:"avgleg" }, rows.map(([c,n,v]) =>
    h("div", { class:"al-row" },
      h("i", { class:"al-sw " + c }),
      h("span", { class:"al-n" }, n),
      h("span", { class:"al-v" }, v))));
  return h("div", {}, lane, axisRow(), leg);
}

// Zeitleiste: eine Zeile je Tag
function timeline(days){
  const wrap = h("div", { class:"tl" });
  let lastDose = null;
  days.forEach(d => {
    const lbl = doseLabel(d);
    if (lastDose != null && lbl !== lastDose)
      wrap.append(h("div", { class:"tl-split" }, h("i"), h("span", {}, lbl || "–"), h("i")));
    lastDose = lbl;
    const row = h("div", { class:"tl-row" });
    row.append(h("span", { class:"tl-day" }, WD[fromIso(d.date).getDay()] + " " + fromIso(d.date).getDate() + "."));
    const lane = h("div", { class:"tl-lane" });
    [0,1].forEach(i => {
      const dz = d.doses[i], w = effWindow(dz);
      if (dz.time && doseActive(dz)) lane.append(dot("d"+(i+1), toMin(dz.time)));
      if (w.onset && w.offset) lane.append(bar("w"+(i+1), toMin(w.onset), toMin(w.offset)));
    });
    row.append(lane);
    wrap.append(row);
  });
  wrap.append(h("div", { class:"tl-row" }, h("span", { class:"tl-day" }), axisRow()));
  return wrap;
}

// Verhalten als gruppierte Balken, Fenster 1 gegen Fenster 2
function groupBars(rows){

function renderUebersicht(){
  const root = document.getElementById("view-uebersicht");
  root.textContent = "";
  const all = sortedDays();
  if (all.length === 0){
    root.append(h("div", { class:"card" }, h("div", { class:"empty" },
      h("p", { class:"big" }, "Noch keine Daten"))));
    return;
  }

  const periodCard = h("div", { class:"card" });
  periodCard.append(segmented(
    [{v:7,t:"7 Tage"},{v:30,t:"30 Tage"},{v:0,t:"Alles"},{v:"custom",t:"Zeitraum"}], periodDays,
    v => {
      periodDays = v ?? 30;
      if (periodDays === "custom" && !customFrom){
        customTo = all[all.length-1].date;
        customFrom = all.length > 13 ? all[all.length-14].date : all[0].date;
      }
      renderUebersicht();
    }, "compact", "period"));
  if (periodDays === "custom"){
    const mk = (val, isFrom) => h("input", { type:"date", value:val || "",
      min: all[0].date, max: all[all.length-1].date,
      onclick:e => { e.stopPropagation(); try { e.target.showPicker(); } catch(err){} },
      onchange:e => {
        if (!e.target.value) return;
        if (isFrom){ customFrom = e.target.value; if (customTo && customFrom > customTo) customTo = customFrom; }
        else { customTo = e.target.value; if (customFrom && customTo < customFrom) customFrom = customTo; }
        renderUebersicht();
      }});
    periodCard.append(h("div", { class:"field" }, h("div", { class:"row" },
      h("div", { class:"grow" }, h("span", { class:"lbl" }, "Von"), mk(customFrom, true)),
      h("div", { class:"grow" }, h("span", { class:"lbl" }, "Bis"), mk(customTo, false)))));
  }
  root.append(periodCard);

  const cur = daysInRange(all), prev = daysInRange(all, 1);
  if (cur.length === 0){
    root.append(h("div", { class:"card" }, h("div", { class:"empty" },
      h("p", { class:"big" }, "Keine Daten in diesem Zeitraum"))));
    return;
  }
  const c = collect(cur), p = collect(prev);
  const dl = (a,b) => (a == null || b == null) ? null : a-b;

  const strip = avgDayStrip(cur);
  if (strip) root.append(h("div", { class:"card" }, h("h2", {}, "Durchschnittstag"), strip));

  root.append(h("div", { class:"card" }, h("h2", {}, "Zeitleiste"),
    h("div", { class:"scroll-y" }, timeline(cur.slice(-42)))));

  const latAll = avg([c.lat1,c.lat2]), latPrev = avg([p.lat1,p.lat2]);
  const lenAll = avg([c.len1,c.len2]), lenPrev = avg([p.len1,p.len2]);
  root.append(h("div", { class:"card" },
    h("div", { class:"kpis" },
      kpi("Latenz", fmtMin(latAll), "", dl(latAll,latPrev), cur.map(d=>avg([metrics(d).lat1,metrics(d).lat2])), false),
      kpi("Wirkdauer", fmtMin(lenAll), "", dl(lenAll,lenPrev), cur.map(d=>avg([metrics(d).len1,metrics(d).len2])), true),
      kpi("Loch", fmtMin(c.gap), "", dl(c.gap,p.gap), cur.map(d=>metrics(d).gap), false),
      kpi("Erfasste Tage", String(cur.length)))));

  const maxImp = Math.max(1, ...cur.flatMap(d => [rv(d,0,"f1","impulses"), rv(d,1,"f2","impulses")].filter(v => v != null)));
  root.append(h("div", { class:"card" }, h("h2", {}, "Verhalten"),
    h("div", { class:"leg" },
      h("span", {}, h("i", { class:"sw b1" }), "Fenster 1"),
      h("span", {}, h("i", { class:"sw b2" }), "Fenster 2")),
    groupBars([
      { name:"Aufgabenstart", a:c.init1, b:c.init2, max:3 },
      { name:"Durchhalten",   a:c.end1,  b:c.end2,  max:3 },
      { name:"Impulskontrolle", a:c.imp1, b:c.imp2, max:maxImp },
      { name:"Vermeidung",    a:c.avoid == null ? null : c.avoid*3, b:null, max:3 }
    ])));

  // Puls
  const pre = avg(cur.flatMap(d => [0,1].map(i => pulseOf(d.doses[i]).pre)));
  const win = avg(cur.flatMap(d => [0,1].map(i => pulseOf(d.doses[i]).win)));
  const dlt = avg(cur.flatMap(d => [0,1].map(i => pulseOf(d.doses[i]).delta)));
  const nPre = cur.filter(d => [0,1].some(i => pulseOf(d.doses[i]).pre != null)).length;
  const nWin = cur.filter(d => [0,1].some(i => pulseOf(d.doses[i]).win != null)).length;
  const nDlt = cur.filter(d => [0,1].some(i => pulseOf(d.doses[i]).delta != null)).length;
  if (pre != null || win != null) root.append(h("div", { class:"card" }, h("h2", {}, "Puls"),
    h("div", { class:"kpis" },
      kpi("Vor der Einnahme", pre == null ? "–" : Math.round(pre), "bpm · " + nPre + "d"),
      kpi("1–3 h danach", win == null ? "–" : Math.round(win), "bpm · " + nWin + "d"),
      kpi("Differenz", dlt == null ? "–" : (dlt > 0 ? "+" : "") + Math.round(dlt), "bpm · " + nDlt + "d"))));

  // Nach Dosis
  const groups = {};

// gemeinsam von Dashboard und Bericht genutzt
function seCounts(days){
  const t = logicalToday(), cut = shiftDate(t, -6);
  const recent = {}, older = {};
  days.forEach(d => [["f1",0],["f2",1]].forEach(([k,i]) => {
    if (!doseActive(d.doses[i])) return;
    const tgt = d.date >= cut ? recent : older;
    d.review[k].se.forEach(x => tgt[x] = (tgt[x]||0)+1);
  }));
  const keys = [...new Set([...Object.keys(recent), ...Object.keys(older)])]
    .sort((a,b) => ((recent[b]||0)+(older[b]||0)) - ((recent[a]||0)+(older[a]||0)));
  const max = Math.max(1, ...keys.map(k => Math.max(recent[k]||0, older[k]||0)));
  return { keys, recent, older, max };
}
function quality(days){
  let full = 0, rows = 0, late = 0;
  days.forEach(d => {
    const ok = ["f1","f2"].every(k => d.review[k].init != null && d.review[k].endur != null)
            && d.doses.every(x => x.taken === false || (x.time && effWindow(x).onset));
    if (ok) full++;
    d.doses.forEach(x => { if (!doseActive(x)) return;
      (x.checks || []).forEach(c => { if (c.r != null){ rows++; if (checkLate(c)) late++; } }); });
  });
  return { full, rows, late };
}
function adherence(days){
  let taken = 0, skipped = 0, missing = 0;
  days.forEach(d => d.doses.forEach(x => {
    if (x.taken === true) taken++; else if (x.taken === false) skipped++; else missing++;
  }));
  return { taken, skipped, missing };
}

}

      r1.init, r1.endur, av(r1.avoid), r1.impulses, r1.se.join(", "),
      r2.init, r2.endur, av(r2.avoid), r2.impulses, r2.se.join(", "),
      pulseOf(d.doses[0]).pre, pulseOf(d.doses[0]).win == null ? "" : Math.round(pulseOf(d.doses[0]).win),
      pulseOf(d.doses[1]).pre, pulseOf(d.doses[1]).win == null ? "" : Math.round(pulseOf(d.doses[1]).win),
      d.doses[0].plan, d.doses[1].plan, r1.note, r2.note].map(q).join(";");

function mergeText(raw){
  let inc;
  try { inc = JSON.parse(raw); }
  catch(e){ dataMsg = { bad:true, t:"Das ist keine gültige Sicherung. Erwartet wird der JSON-Text aus dem Export." }; return renderDaten(); }
  if (!inc || !inc.days || inc.schema !== SCHEMA){
    dataMsg = { bad:true, t:"Unbekanntes Format oder andere App-Version." }; return renderDaten();
  }
  migrate(inc);                 // ältere Sicherungen ins aktuelle Eintragsformat heben
  let added = 0, updated = 0, kept = 0;
  // Tage, die nur lokal existieren, werden nie angefasst.
  // Ein leerer Tag aus der Datei überschreibt nie einen Tag mit Inhalt.
  for (const [date, day] of Object.entries(inc.days)){
    const mine = state.days[date];
    const incHas = dayHasData(day), mineHas = mine ? dayHasData(mine) : false;
    if (!mine){ if (incHas){ state.days[date] = day; added++; } continue; }
    if (!incHas){ kept++; continue; }
    if (!mineHas){ state.days[date] = day; updated++; continue; }
    if ((day.updatedAt || "") > (mine.updatedAt || "")){ state.days[date] = day; updated++; }
    else kept++;
  }
  save();
  dataMsg = { bad:false, t:added + " Tage neu, " + updated + " aktualisiert, " + kept + " behalten (lokal neuer)." };
  renderDaten();
}
function importJSON(file){
  const fr = new FileReader();
  fr.onload = () => mergeText(fr.result);
  fr.readAsText(file);
}

  box.append(inner, h("div", { class:"rbar" },
    h("button", { class:"sec", type:"button", onclick:closeReport }, "Schließen"),
    h("button", { class:"sec", type:"button", onclick:() => { reportAll = !reportAll; R(); } },
      reportAll ? "Nur 14 Tage" : "Alle Tage"),
    h("button", { type:"button", onclick:() => { try { window.print(); } catch(e){} } }, "Drucken")));
  document.body.append(box);
}

/* ===================== Rahmen ===================== */
function renderAll(){
  for (const t of ["tracking","uebersicht","daten"])
    document.getElementById("view-" + t).classList.toggle("hidden", t !== currentTab);
  if (currentTab === "tracking") renderTracking();
  else if (currentTab === "uebersicht") renderUebersicht();
  else renderDaten();
}
const TAB_ORDER = ["tracking","uebersicht","daten"];
function moveTabThumb(){
  const t = document.getElementById("tthumb");
  if (t) t.style.transform = "translateX(calc(" + TAB_ORDER.indexOf(currentTab) + " * (100% + 3px)))";
}
document.querySelectorAll("nav.tabs button").forEach(b => b.addEventListener("click", () => {
  currentTab = b.dataset.tab;
  moveTabThumb();
  if (currentTab === "tracking"){ openBlock = null; openWin = null; }
  document.querySelectorAll("nav.tabs button").forEach(x => x.setAttribute("aria-selected", String(x === b)));
  window.scrollTo({ top:0 });
  renderAll();
}));

document.addEventListener("click", e => {
  if (armDelete && !e.target.classList.contains("danger")){ armDelete = false; if (currentTab === "daten") renderDaten(); }
}, true);


/* ===================== Schnellerfassung ===================== */
function nowMin(){ const d = new Date(); return d.getHours()*60 + d.getMinutes(); }
// Welches Fenster ist gerade dran? Laufendes zuerst, sonst das nächste unerfasste.
function activeDoseIdx(day){
  const n = nowMin();
  for (let i = 1; i >= 0; i--){
    const d = day.doses[i];
    if (d.taken === true && d.time && n >= toMin(d.time) && n <= toMin(d.time) + HOURS*60) return i;
  }
  if (!day.doses[0].time && day.doses[0].taken !== false) return 0;
  if (!day.doses[1].time && day.doses[1].taken !== false) return 1;
  for (let i = 1; i >= 0; i--) if (day.doses[i].time) return i;
  return 0;
}

let sheetEls = null;
function closeQuick(){
  if (!sheetEls) return;
  const { back, sheet } = sheetEls; sheetEls = null;
  back.classList.remove("on"); sheet.classList.remove("on");
  document.getElementById("fab").classList.remove("open");
  setTimeout(() => { back.remove(); sheet.remove(); }, 420);
  document.removeEventListener("keydown", onSheetKey);
}
function toggleQuick(){ sheetEls ? closeQuick() : openQuick(); }
function onSheetKey(e){ if (e.key === "Escape") closeQuick(); }
document.addEventListener("keydown", e => { if (e.key === "Escape") closeReport(); });

function openQuick(){
  if (sheetEls) return;
  const date = logicalToday();
  if (!state.days[date]) state.days[date] = blankDay(date);
  const day = state.days[date];

  let target = activeDoseIdx(day);
  let time = nowHM();
  let rating = null;
  let note = "";
  let pulse = null;

  const back = h("div", { class:"backdrop", onclick:closeQuick });
  const sheet = h("div", { class:"sheet", role:"dialog", "aria-modal":"true", "aria-label":"Schnell erfassen" });
  const bodyBox = h("div", { class:"sheet-body" });
  const footBox = h("div", { class:"sheet-foot" });

  const draw = () => {
    const dose = day.doses[target];
    bodyBox.textContent = "";

    bodyBox.append(h("div", { class:"field" },
      segmented([{v:0,t:"Einnahme 1"},{v:1,t:"Einnahme 2"}], target, v => {
        if (v == null) return; target = v; draw();
      }, "compact", "q-target")));

    bodyBox.append(h("div", { class:"field" }, h("div", { class:"row" },
      h("div", { class:"grow" },
        h("span", { class:"lbl" }, "Uhrzeit"),
        h("input", { type:"time", value:time,
          onchange:e => { if (e.target.value){ time = e.target.value; refresh(); } }})),
      h("div", { class:"grow" },
        h("span", { class:"lbl" }, "Puls"),
        h("input", { type:"number", inputmode:"numeric", min:"30", max:"220", placeholder:"–",
          value: pulse ?? "", oninput:e => { pulse = e.target.value === "" ? null : Number(e.target.value); refresh(); }})))));

    bodyBox.append(h("div", { class:"field" },
      h("span", { class:"lbl" }, "Wirkung (optional)"),
      segmented(R_LABELS.map((t,v) => ({ v, t })), rating, v => { rating = v; draw(); },
        "compact", "q-rating", WIRK_COLORS)));

    bodyBox.append(h("div", { class:"field grow-field" },
      h("span", { class:"lbl" }, "Notiz"),
      h("textarea", { class:"fill",
        placeholder:"Woran merkst du es? Nebenwirkungen? Was gerade passiert?",
        oninput:e => { note = e.target.value; refresh(); }}, note)));

    if (!dose.time) bodyBox.append(h("p", { class:"lockhint" },
      "Für dieses Fenster ist noch keine Einnahme erfasst. Der Eintrag wird trotzdem gesichert."));

    refresh();
  };

  const saveBtn = h("button", { class:"primary", type:"button", onclick:() => commit() }, "Sichern");
  const refresh = () => {
    const hasNote = note.trim().length > 0;
    saveBtn.disabled = rating == null && !hasNote && pulse == null;
    saveBtn.textContent = rating != null ? "Wirkung sichern" : hasNote ? "Notiz sichern" : pulse != null ? "Puls sichern" : "Sichern";
  };

  const commit = () => {
    const dose = day.doses[target];
    if (rating == null && !note.trim() && pulse == null) return;
    dose.checks.push({ id:newId(), t:time, r:rating, note:note.trim(), pulse, at:new Date().toISOString() });
    save(date);
    closeQuick();
    if (currentTab !== "tracking"){
      currentTab = "tracking";
      document.querySelectorAll("nav.tabs button").forEach(x => x.setAttribute("aria-selected", String(x.dataset.tab === "tracking")));
      moveTabThumb();
    }
    currentDate = date; openBlock = target; openWin = null; hoursOpen[target] = true;
    renderAll();
    flashSaved(rating != null ? "Wirkung erfasst" : "Notiz erfasst");
  };

  sheet.append(
    h("h2", {}, "Schnell erfassen"),
    h("p", { class:"when" }, dateLabel(date) + ", " + nowHM()),
    bodyBox,
    footBox);
  footBox.append(saveBtn);
  draw();
  document.body.append(back, sheet);
  sheetEls = { back, sheet };
  document.addEventListener("keydown", onSheetKey);
  document.getElementById("fab").classList.add("open");
  requestAnimationFrame(() => { back.classList.add("on"); sheet.classList.add("on"); });

}
document.getElementById("fab").addEventListener("click", toggleQuick);

// Aufruf über die Adresse: ?log=0..3 legt sofort einen Eintrag an, ?quick=1 öffnet das Fenster
function handleUrlAction(){
  const p = new URLSearchParams(location.search);
  const clean = () => history.replaceState(null, "", location.pathname);
  const raw = p.get("log");
  if (raw != null && /^[0-3]$/.test(raw)){
    const r = Number(raw);
    const date = logicalToday();
    if (!state.days[date]) state.days[date] = blankDay(date);
    const day = state.days[date];
    const idx = activeDoseIdx(day);
    day.doses[idx].checks.push({ id:newId(), t:nowHM(), r, note:"", pulse:null, at:new Date().toISOString() });
    save(date);
    currentDate = date; openBlock = idx; openWin = null; hoursOpen[idx] = true;
    renderAll();
    flashSaved(R_LABELS[r] + " · " + nowHM());
    clean();
    return;
  }
  if (p.get("quick") === "1"){ clean(); openQuick(); }
}

(async function init(){
  await load();
  currentDate = logicalToday();
  moveTabThumb();
  renderAll();
  handleUrlAction();
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch(e){}
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
})();
</script>
